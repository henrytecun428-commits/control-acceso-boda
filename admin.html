<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18211d">
  <title>Administración · Boda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-card { width:min(100%, 980px); padding:clamp(26px,5vw,46px); background:rgba(251,250,247,.97); border-radius:28px; box-shadow:var(--shadow); }
    .admin-head { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:26px; }
    .admin-head h1 { font-size:clamp(42px,7vw,58px); }
    .admin-head p { color:var(--muted); margin:8px 0 0; font-size:13px; }
    .auth-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .field label { display:block; margin:0 0 7px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
    .field input { text-transform:none; letter-spacing:0; }
    .panel { margin-top:20px; padding:20px; background:white; border:1px solid var(--line); border-radius:18px; }
    .panel h2 { margin:0 0 16px; font-family:"Cormorant Garamond",serif; font-size:28px; }
    .form-grid { display:grid; grid-template-columns:1.4fr 1fr .7fr auto; gap:10px; align-items:end; }
    .toggle { display:flex; align-items:center; gap:9px; min-height:50px; color:var(--muted); font-size:12px; }
    .toggle input { width:18px; height:18px; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { padding:13px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
    th { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.06em; }
    .pill { display:inline-flex; padding:5px 9px; border-radius:999px; background:#f3f0e9; font-size:10px; font-weight:700; }
    .danger-link { border:0; background:transparent; color:var(--danger); padding:4px 7px; font-size:12px; }
    .danger-link:hover { background:#fff1f1; color:var(--danger); transform:none; }
    .hidden { display:none !important; }
    .notice { margin:12px 0 0; color:var(--muted); font-size:12px; line-height:1.5; }
    @media(max-width:760px){ .admin-head{align-items:flex-start; flex-direction:column;} .auth-grid,.form-grid{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <main class="page-shell">
    <section class="admin-card">
      <header class="admin-head">
        <div>
          <p class="eyebrow">PANEL PRIVADO</p>
          <h1>Invitaciones</h1>
          <p>Administra códigos, cupos y permisos de niños.</p>
        </div>
        <button id="logout" class="hidden" type="button">Cerrar sesión</button>
      </header>

      <section id="auth-panel" class="panel">
        <h2>Entrar al panel</h2>
        <div class="auth-grid">
          <div class="field"><label for="email">Correo</label><input id="email" type="email" autocomplete="email" placeholder="tu correo"></div>
          <div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" placeholder="mínimo 6 caracteres"></div>
        </div>
        <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
          <button id="login" type="button">Iniciar sesión</button>
          <button id="signup" type="button">Crear cuenta de administrador</button>
        </div>
        <p id="auth-message" class="notice"></p>
      </section>

      <section id="admin-panel" class="hidden">
        <div class="panel">
          <h2>Nueva invitación</h2>
          <div class="form-grid">
            <div class="field"><label for="guest-name">Nombre</label><input id="guest-name" type="text" placeholder="Alejandro"></div>
            <div class="field"><label for="guest-code">Código</label><input id="guest-code" type="text" maxlength="20" placeholder="ALE123"></div>
            <div class="field"><label for="guest-total">Cupos</label><input id="guest-total" type="number" min="1" max="100" value="2"></div>
            <div><button id="create-invitation" type="button">Guardar</button></div>
          </div>
          <label class="toggle"><input id="allow-children" type="checkbox"> Permitir niños</label>
          <p id="form-message" class="notice"></p>
        </div>

        <div class="panel">
          <h2>Invitaciones registradas</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nombre</th><th>Código</th><th>Cupos</th><th>Ingresaron</th><th>Disponibles</th><th>Niños</th><th>Estado</th><th></th></tr></thead>
              <tbody id="invitations-body"></tbody>
            </table>
          </div>
          <p id="list-message" class="notice"></p>
        </div>
      </section>
    </section>
  </main>
  <script type="module" src="admin.js"></script>
</body>
</html>
